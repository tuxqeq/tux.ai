<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 460" font-family="Georgia, 'Times New Roman', serif">
  <rect width="1300" height="460" fill="#f1f1ef"/>

  <!-- 5 boxes in a row -->
  <!-- Step 1 -->
  <g>
    <rect x="40" y="160" width="200" height="130" rx="8" fill="#fff" stroke="#111" stroke-width="1.6"/>
    <text x="140" y="190" text-anchor="middle" font-size="13" fill="#666" font-family="Helvetica, Arial, sans-serif">STEP 1</text>
    <text x="140" y="220" text-anchor="middle" font-size="17" fill="#111">Generate</text>
    <text x="140" y="244" text-anchor="middle" font-size="12" fill="#444" font-family="Helvetica, Arial, sans-serif">1,000+ synthetic docs</text>
    <text x="140" y="262" text-anchor="middle" font-size="12" fill="#444" font-family="Helvetica, Arial, sans-serif">5 persona types · Faker</text>
    <text x="140" y="280" text-anchor="middle" font-size="11" fill="#888" font-family="Helvetica, Arial, sans-serif">(all values fake)</text>
  </g>

  <!-- Step 2 -->
  <g>
    <rect x="280" y="160" width="200" height="130" rx="8" fill="#fff" stroke="#111" stroke-width="1.6"/>
    <text x="380" y="190" text-anchor="middle" font-size="13" fill="#666" font-family="Helvetica, Arial, sans-serif">STEP 2</text>
    <text x="380" y="220" text-anchor="middle" font-size="17" fill="#111">Tokenize</text>
    <text x="380" y="244" text-anchor="middle" font-size="12" fill="#444" font-family="Helvetica, Arial, sans-serif">Hybrid detector</text>
    <text x="380" y="262" text-anchor="middle" font-size="12" fill="#444" font-family="Helvetica, Arial, sans-serif">+ securely wipe raw</text>
    <text x="380" y="280" text-anchor="middle" font-size="11" fill="#888" font-family="Helvetica, Arial, sans-serif">(overwrite + unlink)</text>
  </g>

  <!-- Step 3 -->
  <g>
    <rect x="520" y="160" width="200" height="130" rx="8" fill="#fff" stroke="#111" stroke-width="1.6"/>
    <text x="620" y="190" text-anchor="middle" font-size="13" fill="#666" font-family="Helvetica, Arial, sans-serif">STEP 3</text>
    <text x="620" y="220" text-anchor="middle" font-size="17" fill="#111">Chat dataset</text>
    <text x="620" y="244" text-anchor="middle" font-size="12" fill="#444" font-family="Helvetica, Arial, sans-serif">Multi-turn examples</text>
    <text x="620" y="262" text-anchor="middle" font-size="12" fill="#444" font-family="Helvetica, Arial, sans-serif">90 / 10 train · val</text>
  </g>

  <!-- Step 4 -->
  <g>
    <rect x="760" y="160" width="200" height="130" rx="8" fill="#fff" stroke="#111" stroke-width="1.6"/>
    <text x="860" y="190" text-anchor="middle" font-size="13" fill="#666" font-family="Helvetica, Arial, sans-serif">STEP 4</text>
    <text x="860" y="220" text-anchor="middle" font-size="17" fill="#111">QLoRA fine-tune</text>
    <text x="860" y="244" text-anchor="middle" font-size="12" fill="#444" font-family="Helvetica, Arial, sans-serif">Qwen3-8B · 4-bit</text>
    <text x="860" y="262" text-anchor="middle" font-size="12" fill="#444" font-family="Helvetica, Arial, sans-serif">Unsloth · completion-only</text>
  </g>

  <!-- Step 5 -->
  <g>
    <rect x="1000" y="160" width="200" height="130" rx="8" fill="#fff" stroke="#111" stroke-width="1.6"/>
    <text x="1100" y="190" text-anchor="middle" font-size="13" fill="#666" font-family="Helvetica, Arial, sans-serif">STEP 5</text>
    <text x="1100" y="220" text-anchor="middle" font-size="17" fill="#111">Export · serve</text>
    <text x="1100" y="244" text-anchor="middle" font-size="12" fill="#444" font-family="Helvetica, Arial, sans-serif">Merge → GGUF</text>
    <text x="1100" y="262" text-anchor="middle" font-size="12" fill="#444" font-family="Helvetica, Arial, sans-serif">Ollama runtime</text>
  </g>

  <!-- Arrows between -->
  <g stroke="#111" stroke-width="1.6" fill="#111">
    <line x1="240" y1="225" x2="280" y2="225"/>
    <polygon points="280,225 270,219 270,231"/>
    <line x1="480" y1="225" x2="520" y2="225"/>
    <polygon points="520,225 510,219 510,231"/>
    <line x1="720" y1="225" x2="760" y2="225"/>
    <polygon points="760,225 750,219 750,231"/>
    <line x1="960" y1="225" x2="1000" y2="225"/>
    <polygon points="1000,225 990,219 990,231"/>
  </g>

  <!-- Top label brace covering steps 1-2 -->
  <text x="270" y="100" text-anchor="middle" font-size="14" fill="#444" font-family="Helvetica, Arial, sans-serif">Raw PII briefly exists, then is destroyed</text>
  <line x1="40" y1="120" x2="480" y2="120" stroke="#111" stroke-width="1.2"/>
  <line x1="40" y1="120" x2="40" y2="140" stroke="#111" stroke-width="1.2"/>
  <line x1="480" y1="120" x2="480" y2="140" stroke="#111" stroke-width="1.2"/>

  <!-- Bottom label covering steps 3-5 -->
  <text x="860" y="370" text-anchor="middle" font-size="14" fill="#444" font-family="Helvetica, Arial, sans-serif">The model is trained, packaged, and served — on tokens only</text>
  <line x1="520" y1="340" x2="1200" y2="340" stroke="#111" stroke-width="1.2"/>
  <line x1="520" y1="320" x2="520" y2="340" stroke="#111" stroke-width="1.2"/>
  <line x1="1200" y1="320" x2="1200" y2="340" stroke="#111" stroke-width="1.2"/>
</svg>
