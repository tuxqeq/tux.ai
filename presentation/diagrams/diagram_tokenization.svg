<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" font-family="Georgia, 'Times New Roman', serif">
  <rect width="1200" height="580" fill="#f1f1ef"/>

  <!-- Original text box -->
  <g>
    <rect x="60" y="60" width="420" height="100" rx="8" fill="#fff" stroke="#111" stroke-width="1.6"/>
    <text x="80" y="90" font-size="13" fill="#666" font-family="Helvetica, Arial, sans-serif">ORIGINAL</text>
    <text x="80" y="120" font-size="15" fill="#111" font-family="monospace">"Contact John Smith at</text>
    <text x="80" y="142" font-size="15" fill="#111" font-family="monospace"> john@acme.com, SSN 123-45-6789"</text>
  </g>

  <!-- Arrow down -->
  <line x1="270" y1="160" x2="270" y2="210" stroke="#111" stroke-width="1.6"/>
  <polygon points="270,210 264,200 276,200" fill="#111"/>

  <!-- Pseudonymizer node -->
  <g>
    <rect x="60" y="210" width="420" height="60" rx="30" fill="#fff" stroke="#111" stroke-width="1.6"/>
    <text x="270" y="248" text-anchor="middle" font-size="17" fill="#111">PIIPseudonymizer · per-dataset AES-256 key</text>
  </g>

  <!-- Arrow down -->
  <line x1="270" y1="270" x2="270" y2="320" stroke="#111" stroke-width="1.6"/>
  <polygon points="270,320 264,310 276,310" fill="#111"/>

  <!-- Tokenized text box -->
  <g>
    <rect x="60" y="320" width="420" height="100" rx="8" fill="#fff" stroke="#111" stroke-width="1.6"/>
    <text x="80" y="350" font-size="13" fill="#666" font-family="Helvetica, Arial, sans-serif">TOKENIZED  →  fed to LLM &amp; stored in DB</text>
    <text x="80" y="380" font-size="15" fill="#111" font-family="monospace">"Contact [PERSON_a1b2] at</text>
    <text x="80" y="402" font-size="15" fill="#111" font-family="monospace"> [EMAIL_c3d4], SSN [SSN_e5f6]"</text>
  </g>

  <!-- Right side: storage architecture -->
  <!-- Redis -->
  <g>
    <ellipse cx="850" cy="100" rx="120" ry="22" fill="#fff" stroke="#111" stroke-width="1.6"/>
    <line x1="730" y1="100" x2="730" y2="160" stroke="#111" stroke-width="1.6"/>
    <line x1="970" y1="100" x2="970" y2="160" stroke="#111" stroke-width="1.6"/>
    <ellipse cx="850" cy="160" rx="120" ry="22" fill="#fff" stroke="#111" stroke-width="1.6"/>
    <path d="M 730 100 a 120 22 0 0 0 240 0" fill="none" stroke="#111" stroke-width="1.6"/>
    <text x="850" y="135" text-anchor="middle" font-size="17" fill="#111">Redis</text>
    <text x="850" y="190" text-anchor="middle" font-size="12" fill="#666" font-family="Helvetica, Arial, sans-serif">token → AES-encrypted value</text>
    <text x="850" y="208" text-anchor="middle" font-size="11" fill="#888" font-family="monospace">[PERSON_a1b2] → 7f9c2e...</text>
  </g>

  <!-- Postgres -->
  <g>
    <ellipse cx="850" cy="320" rx="120" ry="22" fill="#fff" stroke="#111" stroke-width="1.6"/>
    <line x1="730" y1="320" x2="730" y2="380" stroke="#111" stroke-width="1.6"/>
    <line x1="970" y1="320" x2="970" y2="380" stroke="#111" stroke-width="1.6"/>
    <ellipse cx="850" cy="380" rx="120" ry="22" fill="#fff" stroke="#111" stroke-width="1.6"/>
    <path d="M 730 320 a 120 22 0 0 0 240 0" fill="none" stroke="#111" stroke-width="1.6"/>
    <text x="850" y="355" text-anchor="middle" font-size="17" fill="#111">PostgreSQL</text>
    <text x="850" y="410" text-anchor="middle" font-size="12" fill="#666" font-family="Helvetica, Arial, sans-serif">dataset AES key, wrapped by</text>
    <text x="850" y="428" text-anchor="middle" font-size="12" fill="#666" font-family="Helvetica, Arial, sans-serif">server MASTER_KEY (AES-256-GCM)</text>
  </g>

  <!-- Arrows from pseudonymizer to storage -->
  <line x1="480" y1="240" x2="700" y2="135" stroke="#111" stroke-width="1.6"/>
  <polygon points="700,135 690,135 695,144" fill="#111"/>
  <line x1="480" y1="240" x2="700" y2="350" stroke="#111" stroke-width="1.6"/>
  <polygon points="700,350 695,341 690,350" fill="#111"/>

  <!-- Bottom note -->
  <text x="600" y="510" text-anchor="middle" font-size="14" fill="#444" font-family="Helvetica, Arial, sans-serif">
    Plaintext PII never touches the database. The key that could unlock it is itself encrypted.
  </text>
</svg>
